[package]
name = "kagayaku"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "backend", "screencast"] }
async-channel = "2.5.0"
async-global-executor = "3.1.0"
async-lock = "3.4.2"
async-trait = "0.1.91"
futures-util = "0.3.33"
iced = { version = "0.14.0", default-features = false, features = ["wayland","thread-pool", "wgpu", "web-colors"] }
sctk = { version = "0.20.0", package = "smithay-client-toolkit", default-features = false }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
zbus = { version = "5.18.0", features = ["serde_bytes"] }

[build-dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
zbus_xml = "5.2.1"
zbus_xmlgen = "5.4.1"
