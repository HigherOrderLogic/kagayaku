[package]
name = "kagayaku"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.14.0", default-features = false, features = ["async-io", "backend", "screencast"] }
async-trait = "0.1.92"
freedesktop-icons = "0.4.0"
freedesktop_entry_parser = "2.0.1"
futures-util = "0.3.34"
iced = { version = "0.14.0", default-features = false, features = ["wayland", "smol", "wgpu", "web-colors", "svg", "image", "advanced"] }
iced_palace = "0.14.0"
sctk = { version = "0.20.0", package = "smithay-client-toolkit", default-features = false, features = ["calloop"] }
smol = "2.0.2"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
zbus = { version = "6.3.0", features = ["serde_bytes"] }

[build-dependencies]
anyhow = "1.0.104"
regex = "1.13.2"
zbus_xml = "6.0.0"
zbus_xmlgen = "6.0.1"
